<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" role="img" aria-labelledby="title desc"><title id="title">候选、SKU、完整成本、内部评审、买手反馈与重新评估</title><desc id="desc">项目结构示意图，实线表示已实现的工作台能力，人工平台操作与预留接口另作标识。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8191a4"/></marker></defs><rect x="1" y="1" width="1238" height="478" rx="24" fill="#f7f9fc" stroke="#dce4ec"/><text x="40" y="48" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#213047" text-anchor="start">业务工作流</text><text x="40" y="78" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#627083" text-anchor="start">从一件商品的来源，到一份能解释成本与核价的内部评审资料。</text><rect x="40" y="115" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="60" y="149" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">1  候选与证据</text><text x="60" y="183" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">商品链接、尺寸、件数</text><text x="60" y="214" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">未知销量不补造</text><rect x="450" y="115" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="470" y="149" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">2  SKU与供货资料</text><text x="470" y="183" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">材质、组成、包装、货源</text><text x="470" y="214" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">平台ID未返回则留空</text><rect x="860" y="115" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="880" y="149" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">3  完整成本与情景</text><text x="880" y="183" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">采购、退回、分摊、税费</text><text x="880" y="214" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">区分贡献率与净收益</text><rect x="40" y="310" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="60" y="344" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">6  重新评估与决定</text><text x="60" y="378" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">补资料、议价、降本或暂缓</text><text x="60" y="409" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">保留历史记录</text><rect x="450" y="310" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="470" y="344" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">5  登记买手反馈</text><text x="470" y="378" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">原话、日期、凭证、SKU核价</text><text x="470" y="409" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">平台任务由人工处理</text><rect x="860" y="310" width="340" height="124" rx="16" fill="#fff" stroke="#dce4ec"/><text x="880" y="344" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#213047" text-anchor="start">4  内部评审资料</text><text x="880" y="378" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#596c82" text-anchor="start">HTML、JSON及只读填写计划</text><text x="880" y="409" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#c24e0c" text-anchor="start">不是Temu导入模板</text><path d="M380 177 H444" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 177 H854" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><path d="M1030 239 V304" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><path d="M860 372 H796" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 372 H386" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><path d="M210 310 V268 H620 V245" fill="none" stroke="#8191a4" stroke-width="2" marker-end="url(#arrow)"/><text x="642" y="273" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#627083" text-anchor="start">依据与核价变化后再计算</text></svg>