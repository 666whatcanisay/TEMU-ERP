<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Temu全托管选品工作台数据库核心关系图</title><desc id="desc">商品与SKU一对多，商品和来源多对多，费用和反馈按SKU关联。图中显示核心关系，完整定义见数据库建表SQL。</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8495a9" stroke-width="1.5"/></marker></defs><rect width="1440" height="1120" rx="24" fill="#f6f8fc"/><text x="40" y="55" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#26384b">MySQL 业务数据库</text><text x="40" y="92" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#65778c">商品 · SKU · 成本 · 证据 · 买手核价 · 内部提报</text><text x="40" y="126" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#bd4c10">21 张业务/字典表 + 1 张版本表  /  19 条外键  /  4 个查询视图</text><path d="M215 350 V447" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="230" y="403" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M545 260 H465 V550 H398" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="475" y="405" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M720 350 V447" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="734" y="404" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M895 255 H1042" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="944" y="241" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M895 550 H1042" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="944" y="536" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M720 645 V742" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="734" y="705" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : N</text><path d="M895 598 H975 V845 H1042" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="984" y="708" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : 1</text><path d="M55 350 H18 V845 H32" fill="none" stroke="#8495a9" stroke-width="2" marker-end="url(#end)"/><text x="25" y="716" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#65778c">1 : 0..1</text><rect x="40" y="160" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="62" y="192" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">证据与规则来源</text><text x="62" y="219" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">sources</text><text x="62" y="254" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">PK source_id</text><text x="62" y="279" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">url / level / verification</text><text x="62" y="304" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">观察价格、币种、日期</text><rect x="545" y="160" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="567" y="192" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">商品主档</text><text x="567" y="219" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">products</text><text x="567" y="254" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">PK product_id</text><text x="567" y="279" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">名称 / 市场 / 内部决定</text><text x="567" y="304" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">平台 ID 保留原始字符串</text><rect x="1050" y="160" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="1072" y="192" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">历史内部提报</text><text x="1072" y="219" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">internal_submissions</text><text x="1072" y="254" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">PK submission_id · FK product_id</text><text x="1072" y="279" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">生成时刻 / 商品 / 标题</text><text x="1072" y="304" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">历史 snapshot_json 禁止覆盖</text><rect x="40" y="455" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="62" y="487" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">商品与证据关联</text><text x="62" y="514" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">product_evidence</text><text x="62" y="549" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">FK product_id + FK source_id</text><text x="62" y="574" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">一条来源可供多商品复核</text><text x="62" y="599" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">未解析引用保留并显式标识</text><rect x="545" y="455" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="567" y="487" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">商品变体</text><text x="567" y="514" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">product_skus</text><text x="567" y="549" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">PK (product_id, merchant_sku)</text><text x="567" y="574" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">报价 / 件数 / 单位 / 平台 ID</text><text x="567" y="599" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">移除用停用，保留历史关联</text><rect x="1050" y="455" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="1072" y="487" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">买手反馈与核价</text><text x="1072" y="514" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">buyer_feedback</text><text x="1072" y="549" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">PK feedback_id · 商品/SKU外键</text><text x="1072" y="574" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">原话 / 凭证 / 日期 / 核价</text><text x="1072" y="599" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">草稿与已核验状态分别保存</text><rect x="40" y="750" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="62" y="782" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">网页快照索引</text><text x="62" y="809" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">source_snapshots</text><text x="62" y="844" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">FK source_id</text><text x="62" y="869" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">磁盘路径 / SHA256 / 核验状态</text><text x="62" y="894" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">网页文件不混入商品主档</text><rect x="545" y="750" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="567" y="782" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">SKU 基础成本</text><text x="567" y="809" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">sku_costs</text><text x="567" y="844" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">FK 商品 + SKU · 费用键唯一</text><text x="567" y="869" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">DECIMAL 金额 / 币种 / 单位</text><text x="567" y="894" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">未知 NULL；预算与确认分开</text><rect x="1050" y="750" width="350" height="190" rx="16" fill="white" stroke="#d9e2ec"/><text x="1072" y="782" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#26384b">完整利润方案</text><text x="1072" y="809" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#bd4c10">sku_profit_plans</text><text x="1072" y="844" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">FK 商品 + SKU</text><text x="1072" y="869" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">预算参数覆盖 / 实际账单替换</text><text x="1072" y="894" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#54667a">默认参数有版本、单位与出处</text><text x="40" y="1000" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#26384b">其余关联表</text><text x="40" y="1032" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#65778c">供货条件 / 材料 / 决定历史 / 尺寸 / 销售属性 / 套装组成 / 参数字典与覆盖 / 实际费用 / 公司政策 / 审计 / 集成状态</text><text x="40" y="1076" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#65778c">核心字段从关系表读取；扩展 JSON 保留未知字段，历史提报快照保留当时依据。完整外键以建表 SQL 为准。</text></svg>